# kev-router configuration example
# Secrets NEVER live here: targets are referenced by ENV VAR NAME and the
# router reads them from the environment at startup.
kev_url: http://127.0.0.1:8009/v1/systemone   # your local kev serve
listen_port: 8323
default_model: fast            # fail-open route when kev is unreachable
kev_timeout_s: 4.0             # kev answers in ~0.1-1.5s; beyond that, fail open
cache_ttl_s: 3600              # per-conversation decision cache (protects prompt caches)
complexity_threshold: 3.0      # 1-4 scale; >= threshold upgrades to complexity_route
complexity_route: powerful

routes:
  fast:
    target: {type: env, env: KEV_ROUTER_TARGET_FAST}   # e.g. a local small model
    model: qwen3:0.6b
    criteria: "Direct lookups, extraction, classification, short localized edits"
  code:
    target: {type: env, env: KEV_ROUTER_TARGET_CODE}   # e.g. a local coding model
    model: deepseek-v4-flash
    criteria: "Code, debugging, stack traces, refactoring, technical implementation"
  powerful:
    target: {type: env, env: KEV_ROUTER_TARGET_POWERFUL}  # e.g. OpenRouter or a cloud API
    model: anthropic/claude-opus-4.6
    criteria: "Complex reasoning, architecture, long documents, high-stakes decisions"
