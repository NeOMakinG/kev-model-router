[project]
name = "kev-router"
version = "0.1.0"
description = "Jev-style model routing powered by kev - local, free, typed decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
kev-router = "kev_router.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["kev_router"]
